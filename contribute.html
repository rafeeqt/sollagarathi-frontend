<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>பங்களிப்பாளர்</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .card { background: white; padding: 30px; display: inline-block; border-radius: 10px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select { display: block; width: 300px; margin: 10px 0; padding: 10px; }
        button { width: 100%; padding: 10px; background: #4b2e83; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>அறிஞர்கள் இணைவாசல்</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <select id="role">
                <option value="scholar">Scholar</option>
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
            </select>
            <input type="text" id="qual" placeholder="Qualification">
            <input type="text" id="inst" placeholder="Institution">
            <button type="submit">Apply</button>
        </form>
    </div>
    <script>
        document.getElementById("regForm").onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch("https://sollagarathi-backend.onrender.com/api/contributors/register", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    full_name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    role: document.getElementById("role").value,
                    qualification: document.getElementById("qual").value,
                    institution: document.getElementById("inst").value
                })
            });
            const data = await res.json();
            if(data.success) { alert("Success!"); window.location.href="index.html"; }
            else { alert("Error: Email might exist."); }
        };
    </script>
</body>
</html>
