<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>சொல் அகராதி</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil&display=swap" rel="stylesheet">
    <style>
        /* FIX 1: Remove global center alignment and set a cleaner background */
        body { font-family: 'Noto Serif Tamil', serif; background:#f4f7f6; margin:0; padding:20px; color: #333; }
        
        .search-container { text-align: center; margin-bottom: 30px; }
        
        input { font-size:20px; padding:12px; width:70%; max-width:500px; border-radius:8px; border:1px solid #ccc; outline: none; transition: 0.3s; }
        input:focus { border-color: #4b2e83; box-shadow: 0 0 8px rgba(75, 46, 131, 0.2); }
        
        button { font-size:18px; padding:12px 25px; cursor:pointer; background:#4b2e83; color:white; border:none; border-radius:8px; transition: 0.3s; }
        button:hover { background: #3a2366; }

        #suggestions { min-height:40px; margin:10px auto; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; max-width: 600px; }
        #suggestions span { cursor:pointer; background:white; padding:5px 12px; border:1px solid #4b2e83; border-radius:4px; font-size: 14px; }
        
        /* FIX 2: Ensure the result container itself is centered but internal text is LEFT aligned */
        #result { margin: 0 auto; max-width: 800px; }
        
        .ext-link { display:inline-block; margin:5px; padding:8px 15px; background:#4b2e83; text-decoration:none; color:white; font-size:13px; border-radius:4px; }
    </style>
</head>
<body>

    <div class="search-container">
        <h1 style="color:#4b2e83;">சொல் அகராதி</h1>
        <input id="word" placeholder="Type in English (amma) or Tamil..." autocomplete="off">
        <div id="suggestions"></div>
        <button onclick="searchWord()">தேடு</button>
    </div>

    <div id="result"></div>

    <div id="external-sources" style="display:none; text-align: center; margin-top:30px;">
        <h4 style="color:#666;">கூடுதல் இணைப்புகள்:</h4>
        <div id="links-container"></div>
    </div>

    <script>
        const input = document.getElementById("word");
        const sugBox = document.getElementById("suggestions");
        const resBox = document.getElementById("result");
        let topSug = "";
        const API = "https://sollagarathi-backend.onrender.com";

        // --- Transliteration Logic ---
        input.addEventListener("input", async () => {
            const val = input.value.split(" ").pop();
            if (!val || /[\u0B80-\u0BFF]/.test(val)) { sugBox.innerHTML = ""; return; }
            try {
                const r = await fetch(`${API}/transliterate`, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ text: val })
                });
                const d = await r.json();
                if (d.options.length) {
                    topSug = d.options[0];
                    sugBox.innerHTML = d.options.map(o => `<span onclick="pick('${o}')">${o}</span>`).join("");
                }
            } catch(e) {}
        });

        function pick(w) {
            const words = input.value.split(" ");
            words[words.length-1] = w;
            input.value = words.join(" ") + " ";
            sugBox.innerHTML = ""; topSug = ""; input.focus();
        }

        input.addEventListener("keydown", (e) => {
            if (e.key === " " && topSug) { e.preventDefault(); pick(topSug); }
            if (e.key === "Enter") searchWord();
        });

 /**
 * FUNCTION: parseContent
 * DESCRIPTION: Safely formats Wikitext. Highlights titles with ":" and literature citations.
 */
function parseContent(text) {
    if (!text) return "";

    try {
        let cleanText = text
            // 1. Remove Wiktionary language headers (e.g., == தமிழ் ==) to fix the gap
            .replace(/== (.*?) ==/g, '') 

            // 2. HIGHLIGHT HEADERS ending with ":" (e.g., "பொருள்:", "கந்தபுராணம் :")
            // This captures words followed by a colon at the start of a line
            .replace(/^([^:<br>\n]+):/gm, '<br><b style="color:#4b2e83; border-left:3px solid #4b2e83; padding-left:8px; display:inline-block; margin-top:10px;">$1:</b>')

            // 3. DIFFERENTIATE CITATIONS (e.g., "(புறநா. 29)" or "(திருவாச. 1, 52)")
            // Styles literature tags to separate them from the definition text
            .replace(/\(([^)]+)\)/g, '<i style="color:#666; font-size:0.92em;">(<b>$1</b>)</i>')

            // 4. FORMAT WIKITEXT HEADERS (=== and ==)
            .replace(/===(.*?)===/g, '<h4 style="color:#4b2e83; margin-top:15px; border-bottom:1px solid #eee;">$1</h4>')
            .replace(/==(.*?)==/g, '<h3 style="color:#333; background:#f9f9f9; padding:5px; border-radius:4px;">$1</h3>')

            // 5. FINAL CLEANUP: Strip stray '=' and handle line breaks
            .replace(/=/g, '')
            .replace(/\n\s*\n/g, '<br>') 
            .replace(/\n/g, '<br>');

        return cleanText;
    } catch (error) {
        // If an error happens, we return the raw text so the app doesn't go blank
        console.error("Formatting Error:", error);
        return text;
    }
}
/**
 * COMPONENT: Result Card Generator
 * FUNCTION: formatResultBox(source, word, text)
 * DESCRIPTION: Wraps the parsed content into a modern, left-aligned UI card.
 */
function formatResultBox(sourceName, title, content) {
    return `
        <div class="result-card" style="background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); margin-bottom:25px; border-left:8px solid #4b2e83; overflow:hidden; text-align: left;">
            <div style="background:#f4f1f8; padding:10px 20px; border-bottom:1px solid #eee; font-size:11px; font-weight:bold; color:#4b2e83; text-transform:uppercase; text-align: left;">
                தகவல் மூலம்: ${sourceName}
            </div>
            <div style="padding: 25px; text-align: left;">
                <h2 style="margin: 0 0 10px 0; color: #4b2e83; font-size: 32px; border-bottom: 2px solid #f4f1f8; padding-bottom: 10px; text-align: left;">
                    ${title}
                </h2>
                <div class="content-body" style="line-height: 1.6; font-size: 17px; color: #333; text-align: left;">
                    ${parseContent(content)}
                </div>
            </div>
        </div>`;
}

/**
 * ACTION: Word Search
 * FUNCTION: searchWord()
 * DESCRIPTION: Orchestrates the API call and UI state updates.
 */
async function searchWord() {
    const q = document.getElementById("word").value.trim();
    if(!q) return;

    // UI Feedback: Loading state
    resBox.innerHTML = "<p style='text-align:center; color:#666;'>தேடப்படுகிறது...</p>";

    try {
        const response = await fetch(`${API}/resolve`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ query: q })
        });
        const data = await response.json();

        // UI Update: Success or Fail state
        if (data.stage === "entry") {
            resBox.innerHTML = formatResultBox(data.source || "அகராதி", data.lemma, data.entry);
        } else {
            resBox.innerHTML = `<div class="box">மன்னிக்கவும், "${q}" காணப்படவில்லை.</div>`;
        }
    } catch (e) {
        console.error("SEARCH ERROR:", e);
        resBox.innerHTML = "<p style='color:red;'>இணையத் தொடர்பு துண்டிக்கப்பட்டது.</p>";
    }
}}

        async function finalize(w) {
            try {
                const r = await fetch(`${API}/finalize`, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ word: w })
                });
                const d = await r.json();
                resBox.innerHTML = formatResultBox("உருவாக்கப்பட்டது", d.lemma, d.entry);
            } catch(e) { alert("Error creating entry"); }
        }

        function showLinks(w) {
            const links = [
                {n:"விக்சனரி", u:`https://ta.wiktionary.org/wiki/${w}`},
                {n:"Lexicon", u:`https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=${w}`}
            ];
            document.getElementById("links-container").innerHTML = links.map(l => `<a class="ext-link" href="${l.u}" target="_blank">${l.n}</a>`).join("");
            document.getElementById("external-sources").style.display = "block";
        }
    </script>
</body>
</html>
