<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>சொல் அகராதி</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif Tamil', serif; background:#f8f8f8; text-align:center; padding:20px; }
        input { font-size:20px; padding:10px; width:70%; max-width:500px; border-radius:8px; border:1px solid #ccc; }
        button { font-size:18px; padding:10px 20px; cursor:pointer; background:#4b2e83; color:white; border:none; border-radius:8px; }
        #suggestions { min-height:40px; margin:10px; display:flex; justify-content:left; gap:10px; flex-wrap:wrap; }
        #suggestions span { cursor:pointer; background:white; padding:5px 10px; border:1px solid #4b2e83; border-radius:4px; }
        .box { background:white; padding:20px; margin:20px auto; max-width:700px; text-align:left; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .title { font-weight:bold; color:#4b2e83; font-size:24px; margin-bottom:10px; }
        .ext-link { display:inline-block; margin:5px; padding:5px 10px; background:#eee; text-decoration:none; color:black; font-size:12px; border-radius:4px; }
    </style>
</head>
<body>
    <h1>சொல் அகராதி</h1>
    <input id="word" placeholder="Type in English (amma) or Tamil..." autocomplete="off">
    <div id="suggestions"></div>
    <button onclick="searchWord()">தேடு</button>
    <div id="result"></div>
    <div id="external-sources" style="display:none; margin-top:20px;">
        <h4>External Links:</h4>
        <div id="links-container"></div>
    </div>

    <script>
        const input = document.getElementById("word");
        const sugBox = document.getElementById("suggestions");
        const resBox = document.getElementById("result");
        let topSug = "";
        const API = "https://sollagarathi-backend.onrender.com";

        input.addEventListener("input", async () => {
            const val = input.value.split(" ").pop();
            if (!val || /[\u0B80-\u0BFF]/.test(val)) { sugBox.innerHTML = ""; return; }
            try {
                const r = await fetch(`${API}/transliterate`, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ text: val })
                });
                const d = await r.json();
                if (d.options.length) {
                    topSug = d.options[0];
                    sugBox.innerHTML = d.options.map(o => `<span onclick="pick('${o}')">${o}</span>`).join("");
                }
            } catch(e) {}
        });

        function pick(w) {
            const words = input.value.split(" ");
            words[words.length-1] = w;
            input.value = words.join(" ") + " ";
            sugBox.innerHTML = ""; topSug = ""; input.focus();
        }

        input.addEventListener("keydown", (e) => {
            if (e.key === " " && topSug) { e.preventDefault(); pick(topSug); }
            if (e.key === "Enter") searchWord();
        });

// CONFIGURATION - Ensure this matches your live Render URL
const API = "https://sollagarathi-backend.onrender.com";

// 1. IMPROVED PARSER: Converts Wikitext symbols to clean HTML
function parseContent(text) {
    if (!text) return "";

    return text
        // Remove Language Headers (e.g., == தமிழ் ==) to fix top gaps
        .replace(/== (.*?) ==/g, '')
        
        // Convert Subheaders (=== Title ===) to styled, left-aligned h4
        .replace(/===(.*?)===/g, '<h4 style="color:#4b2e83; margin:15px 0 5px 0; text-align: left; border-bottom: 1px solid #eee; padding-bottom: 5px;">$1</h4>')
        
        // Convert Section Headers (== Title ==) to styled h3
        .replace(/==(.*?)==/g, '<h3 style="color:#222; margin:20px 0 10px 0; background:#f9f9f9; padding:8px; border-radius:4px; text-align: left;">$1</h3>')
        
        // Handle example markers (எ. கா.)
        .replace(/\(எ\. கா\.\)/g, '<br><b style="color:#666; display: block; margin-top: 5px; text-align: left;">உதாரணம்:</b>')
        
        // Clean up remaining stray '=' symbols to fix readability
        .replace(/=/g, '')

        // Fix line breaks to prevent "wall of text"
        .replace(/\n\s*\n/g, '<br><br>') 
        .replace(/\n/g, '<br>');
}

// 2. STYLED BOX: Forces left-alignment and adds source titles
function formatResultBox(sourceName, title, content) {
    return `
        <div class="result-card" style="background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); margin: 20px auto; max-width: 850px; border-left:8px solid #4b2e83; overflow:hidden; text-align: left;">
            <div style="background:#f4f1f8; padding:10px 20px; border-bottom:1px solid #eee; font-size:12px; font-weight:bold; color:#4b2e83; text-transform:uppercase; text-align: left;">
                தகவல் மூலம்: ${sourceName}
            </div>
            <div style="padding: 25px; text-align: left;">
                <h2 style="margin: 0 0 10px 0; color: #4b2e83; font-size: 32px; text-align: left; border-bottom: 2px solid #f4f1f8; padding-bottom: 10px;">
                    ${title}
                </h2>
                <div class="parsed-content" style="line-height: 1.8; font-size: 17px; color: #333; text-align: left;">
                    ${parseContent(content)}
                </div>
            </div>
        </div>`;
}

// 3. UPDATED SEARCH: Preserves database and external fetch logic
async function searchWord() {
    const q = document.getElementById("word").value.trim();
    const resBox = document.getElementById("result");
    if(!q) return;

    resBox.innerHTML = "<p>தேடப்படுகிறது...</p>";

    try {
        const response = await fetch(`${API}/resolve`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ query: q })
        });
        const data = await response.json();

        if (data.stage === "entry") {
            // Displays the record with appropriate source name
            resBox.innerHTML = formatResultBox(data.source || "அகராதி", data.lemma, data.entry);
        } else {
            resBox.innerHTML = `<div class="result-card" style="padding:20px; text-align: left;">தகவல் இல்லை. <button onclick="finalize('${q}')">உருவாக்கு</button></div>`;
        }
    } catch (e) {
        resBox.innerHTML = "Error connecting to server.";
    }
}

        async function finalize(w) {
            const r = await fetch(`${API}/finalize`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ word: w })
            });
            const d = await r.json();
            resBox.innerHTML = `<div class="box"><div class="title">${d.lemma}</div>${d.entry}</div>`;
        }

        function showLinks(w) {
            const links = [
                {n:"விக்சனரி", u:`https://ta.wiktionary.org/wiki/${w}`},
                {n:"Lexicon", u:`https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=${w}`}
            ];
            document.getElementById("links-container").innerHTML = links.map(l => `<a class="ext-link" href="${l.u}" target="_blank">${l.n}</a>`).join("");
            document.getElementById("external-sources").style.display = "block";
        }
    </script>
</body>
</html>
